name: "Orkestra E2E"
description: "Run Orkestra E2E tests — installs ork and runs ork e2e"

inputs:
  e2e-file:
    description: "Path to the e2e.yaml spec file"
    required: false
    default: "e2e.yaml"
  ork-version:
    description: "Ork CLI version to install (default: latest)"
    required: false
    default: "latest"
  keep-cluster:
    description: "Keep the kind cluster after the test completes"
    required: false
    default: "false"
  cluster:
    description: "Use an existing kubectl context instead of creating a cluster"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install ork
      shell: bash
      run: |
        curl -sSL https://get.orkestra.sh \
          | ORK_VERSION=${{ inputs.ork-version }} bash
        echo "$HOME/.orkestra/bin" >> $GITHUB_PATH

    - name: Run E2E
      shell: bash
      run: |
        KEEP=""
        CLUSTER=""
        [[ "${{ inputs.keep-cluster }}" == "true" ]] && KEEP="--keep-cluster"
        [[ -n "${{ inputs.cluster }}" ]] && CLUSTER="--cluster ${{ inputs.cluster }}"
        ork e2e -f "${{ inputs.e2e-file }}" $KEEP $CLUSTER
