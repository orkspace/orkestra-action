name: "Orkestra"
description: "The official GitHub Action for Orkestra — runs the full ork CLI surface from any workflow"

inputs:
  ork-version:
    description: "Version of the ork CLI to install (e.g. v1.2.3). Defaults to the latest release."
    required: false
    default: ""

  working-directory:
    description: "Directory to run commands in. Defaults to the repository root."
    required: false
    default: "."

  # ── init ────────────────────────────────────────────────────────────────────
  init:
    description: "Run ork init before all other steps. Useful in CI when example files are not checked in."
    required: false
    default: "false"
  pack:
    description: "Example pack to initialise (beginner, intermediate, advanced, use-cases, …). Used with init: true."
    required: false
    default: ""

  # ── validate ────────────────────────────────────────────────────────────────
  validate:
    description: "Enable validate. 'true' = auto-detect katalog.yaml/komposer.yaml. Path = validate that file."
    required: false
    default: ""
  validate-depth:
    description: "full → ork validate --full (RBAC, dependency graph, per-CRD permissions)."
    required: false
    default: "single"

  # ── simulate ─────────────────────────────────────────────────────────────────
  simulate:
    description: "Enable simulate. 'true' = auto-detect (simulate.yaml → e2e.yaml → katalog.yaml). Path = use that file directly."
    required: false
    default: ""
  simulate-depth:
    description: "full → ork simulate ./... (recursive discovery). single (default) = auto-detect or explicit file."
    required: false
    default: "single"
  simulate-katalog:
    description: "Explicit katalog.yaml path. Always wins over simulate and simulate-depth."
    required: false
    default: ""
  simulate-cr:
    description: "Explicit cr.yaml path. Paired with simulate-katalog. CLI falls back to cr.yaml in cwd if omitted."
    required: false
    default: ""
  simulate-crd:
    description: "CRD name to target when the katalog defines multiple (ork simulate --crd). All CRDs if omitted."
    required: false
    default: ""
  simulate-cycles:
    description: "Maximum reconcile cycles (ork simulate --cycles)."
    required: false
    default: ""
  simulate-skip-external:
    description: "Stub external: HTTP calls — no real network requests. Defaults to true since CI has no dev server."
    required: false
    default: "true"
  simulate-skip:
    description: "Comma-separated path patterns to skip in ./... discovery (ork simulate --skip)."
    required: false
    default: ""
  simulate-debug:
    description: "Save per-cycle op trace to simulate-debug-output (ork simulate --debug-ops)."
    required: false
    default: "false"
  simulate-debug-output:
    description: "File to write --debug-ops trace to."
    required: false
    default: "simulate-debug.txt"

  # ── plan ────────────────────────────────────────────────────────────────────
  plan:
    description: "Path to katalog.yaml to diff against the deployed Katalog. Skip if empty."
    required: false
    default: ""
  plan-bundle:
    description: "Path to a bundle.yaml file. Reads the deployed Katalog from it — no cluster access needed."
    required: false
    default: ""
  plan-cm:
    description: "Path to a configmap.yaml file. Reads the deployed Katalog from it — no cluster access needed."
    required: false
    default: ""
  plan-namespace:
    description: "Namespace of the deployed Katalog ConfigMap — only used when neither plan-bundle nor plan-cm is set."
    required: false
    default: "orkestra-system"
  plan-output:
    description: "File to write the plan diff output to."
    required: false
    default: "plan.txt"
  comment-on-pr:
    description: "Post the plan diff as a comment on the pull request. Requires pull-requests: write permission on the job."
    required: false
    default: ""
  github-token:
    description: "GitHub token for posting PR comments. Only used when comment-on-pr is set."
    required: false
    default: ${{ github.token }}

  # ── template ─────────────────────────────────────────────────────────────────
  template:
    description: "'true' = auto-detect katalog.yaml in working-directory. Path = render that file. Skip if empty."
    required: false
    default: ""
  template-yaml-output:
    description: "Output file for the YAML-rendered Katalog (ork template --yaml)."
    required: false
    default: "template.yaml"
  template-json-output:
    description: "Output file for the JSON-rendered Katalog (ork template --json)."
    required: false
    default: "template.json"

  # ── generate bundle ─────────────────────────────────────────────────────────
  generate-bundle:
    description: "Path to katalog.yaml to generate a complete installation bundle from. Skip if empty."
    required: false
    default: ""
  generate-bundle-output:
    description: "Output file for the generated bundle."
    required: false
    default: "bundle.yaml"
  generate-bundle-namespace:
    description: "Kubernetes namespace for the bundle."
    required: false
    default: "orkestra-system"

  # ── generate configmap ──────────────────────────────────────────────────────
  generate-configmap:
    description: "Path to katalog.yaml or komposer.yaml to generate a ConfigMap from. Skip if empty."
    required: false
    default: ""
  generate-configmap-output:
    description: "Output file for the generated ConfigMap."
    required: false
    default: "configmap.yaml"
  generate-configmap-namespace:
    description: "Kubernetes namespace for the ConfigMap."
    required: false
    default: "orkestra-system"

  # ── generate rbac ───────────────────────────────────────────────────────────
  generate-rbac:
    description: "Path to katalog.yaml to generate RBAC from. Skip if empty."
    required: false
    default: ""
  generate-rbac-output:
    description: "Output file for the generated RBAC ClusterRole."
    required: false
    default: "rbac.yaml"
  generate-rbac-namespace:
    description: "Kubernetes namespace for the RBAC ServiceAccount."
    required: false
    default: "orkestra-system"

  # ── generate registry (typed operators) ─────────────────────────────────────
  generate-registry:
    description: "Comma-separated list of project directories to generate runtime registries for. Skip if empty."
    required: false
    default: ""

  # ── e2e ─────────────────────────────────────────────────────────────────────
  e2e:
    description: "Enable e2e. 'true' = auto-detect e2e.yaml. Path = use that file directly."
    required: false
    default: ""
  e2e-depth:
    description: "full → ork e2e ./... (recursive discovery). single (default) = use e2e or explicit file."
    required: false
    default: "single"
  e2e-keep-cluster:
    description: "Keep the kind cluster after e2e completes (useful for debugging)."
    required: false
    default: "false"
  e2e-cluster:
    description: "Use an existing kubectl context instead of creating a new cluster."
    required: false
    default: ""
  e2e-wait:
    description: "Wait duration between tests in ./... discovery mode. Lets clusters fully tear down before the next starts."
    required: false
    default: "3s"
  e2e-skip:
    description: "Comma-separated path patterns to skip in ./... discovery (ork e2e --skip)."
    required: false
    default: ""
  e2e-report-file:
    description: "Write the markdown results report to this file in addition to the GitHub step summary."
    required: false
    default: ""

  # ── registry push ───────────────────────────────────────────────────────────
  registry-push:
    description: "Push a pattern to the registry. Value: 'name:version /path/to/dir' or just '/path/to/dir'. Skip if empty."
    required: false
    default: ""
  registry-push-force:
    description: "Force push even if e2e fails or metadata version differs."
    required: false
    default: "false"
  registry-push-no-e2e:
    description: "Skip the e2e gate when pushing (even if e2e.yaml is present)."
    required: false
    default: "false"
  registry-url:
    description: "OCI registry URL (e.g. ghcr.io/myorg/patterns). Also read from ORK_REGISTRY env var."
    required: false
    default: ""
  registry-username:
    description: "Registry username for authentication."
    required: false
    default: ""
  registry-password:
    description: "Registry password or token for authentication."
    required: false
    default: ""

  # ── registry pull ───────────────────────────────────────────────────────────
  registry-pull:
    description: "Pull a pattern from the registry. Value: 'name:version'. Skip if empty."
    required: false
    default: ""
  registry-pull-out:
    description: "Directory to extract the pulled pattern into."
    required: false
    default: ""

  # ── gate ────────────────────────────────────────────────────────────────────
  gate:
    description: "'true' = auto-detect cr.yaml. Path = run ork gate against that file. Empty = skip."
    required: false
    default: ""
  gate-katalog:
    description: "Explicit katalog.yaml path for ork gate. Auto-detected when omitted."
    required: false
    default: ""
  gate-crd:
    description: "CRD name to target when the katalog defines multiple. All CRDs if omitted."
    required: false
    default: ""

  # ── serve apply ─────────────────────────────────────────────────────────────
  serve-apply:
    description: "'true' = auto-detect cr.yaml. Path = apply that CR file via the Gateway API. Empty = skip."
    required: false
    default: ""
  serve-url:
    description: "Gateway API base URL (e.g. https://gateway.myorg.io)."
    required: false
    default: ""
  serve-token:
    description: "Static bearer token for Gateway API authentication. Mutually exclusive with serve-oidc."
    required: false
    default: ""
  serve-oidc:
    description: "'true' = mint a GitHub Actions OIDC token and use it as the bearer token. Requires id-token: write permission on the job."
    required: false
    default: ""
  serve-oidc-audience:
    description: "Audience for the minted OIDC token. Defaults to 'orkestra'."
    required: false
    default: "orkestra"
  serve-target:
    description: "Serve target name to apply against. Required when the CRD has multiple targets."
    required: false
    default: ""
  serve-alias:
    description: "Serve alias name. Uses the primary target when omitted."
    required: false
    default: ""
  serve-dry-run:
    description: "'true' = preview what would be applied without writing to the cluster (?dryRun=true)."
    required: false
    default: ""

  # ── serve play ──────────────────────────────────────────────────────────────
  serve-play:
    description: "Path to a CR file to preview via ork serve play (no cluster write). Empty = skip."
    required: false
    default: ""
  serve-play-katalog:
    description: "Explicit katalog.yaml path for ork serve play. Auto-detected when omitted."
    required: false
    default: ""

outputs:
  # ── plan ────────────────────────────────────────────────────────────────────
  plan-file:
    description: "Path to the plan diff output file."
    value: ${{ steps.plan.outputs.file }}
  plan-no-changes:
    description: "'true' if ork plan detected no changes — the deployed config is already up to date."
    value: ${{ steps.plan.outputs.no-changes }}

  # ── template ─────────────────────────────────────────────────────────────────
  template-yaml-file:
    description: "Path to the YAML-rendered runtime Katalog."
    value: ${{ steps.template.outputs.yaml-file }}
  template-json-file:
    description: "Path to the JSON-rendered runtime Katalog."
    value: ${{ steps.template.outputs.json-file }}

  # ── generate ────────────────────────────────────────────────────────────────
  bundle-file:
    description: "Path to the generated bundle.yaml file."
    value: ${{ steps.generate-bundle.outputs.file }}
  configmap-file:
    description: "Path to the generated configmap.yaml file."
    value: ${{ steps.generate-configmap.outputs.file }}
  rbac-file:
    description: "Path to the generated rbac.yaml file."
    value: ${{ steps.generate-rbac.outputs.file }}
  registry-file:
    description: "Path to the generated zz_generated_runtime_registry.go file."
    value: ${{ steps.generate-registry.outputs.file }}

  # ── simulate ─────────────────────────────────────────────────────────────────
  simulate-debug-file:
    description: "Path to the --debug-ops trace file (only when simulate-debug: true)."
    value: ${{ steps.simulate.outputs.debug-file }}

  # ── registry pull ────────────────────────────────────────────────────────────
  pattern-path:
    description: "Local path where the pulled pattern was extracted."
    value: ${{ steps.registry-pull.outputs.path }}

  # ── serve ────────────────────────────────────────────────────────────────────
  serve-applied:
    description: "'true' when serve-apply completed successfully."
    value: ${{ steps.serve-apply.outputs.applied }}
  serve-play-file:
    description: "Path to the serve play output file."
    value: ${{ steps.serve-play.outputs.file }}

runs:
  using: "composite"
  steps:
    - name: Install ork
      shell: bash
      run: |
        ORK_BIN="$HOME/.orkestra/bin/ork"
        REQUESTED="${{ inputs.ork-version }}"

        if [[ -f "$ORK_BIN" ]]; then
          if [[ -z "$REQUESTED" ]]; then
            echo "$HOME/.orkestra/bin" >> $GITHUB_PATH
            exit 0
          fi
          INSTALLED=$("$ORK_BIN" version 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [[ "$INSTALLED" == "$REQUESTED" ]]; then
            echo "$HOME/.orkestra/bin" >> $GITHUB_PATH
            exit 0
          fi
        fi

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)          ARCH="amd64" ;;
          aarch64|arm64)   ARCH="arm64" ;;
        esac

        mkdir -p "$HOME/.orkestra/bin"

        if [[ -n "$REQUESTED" ]]; then
          URL="https://github.com/orkspace/orkestra/releases/download/${REQUESTED}/ork_${OS}_${ARCH}.tar.gz"
        else
          URL="https://github.com/orkspace/orkestra/releases/latest/download/ork_${OS}_${ARCH}.tar.gz"
        fi

        curl -sSfL "$URL" | tar -xz -C "$HOME/.orkestra/bin" ork
        chmod +x "$HOME/.orkestra/bin/ork"
        echo "$HOME/.orkestra/bin" >> $GITHUB_PATH

    - name: Init pack
      if: inputs.init == 'true' && inputs.pack != ''
      shell: bash
      run: ork init --pack "${{ inputs.pack }}"

    - name: Registry login
      if: inputs.registry-username != '' && inputs.registry-password != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "${{ inputs.registry-password }}" \
          | docker login ${{ inputs.registry-url || 'ghcr.io' }} \
              -u "${{ inputs.registry-username }}" --password-stdin

    - name: Validate
      if: inputs.validate != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        FULL=""
        [[ "${{ inputs.validate-depth }}" == "full" ]] && FULL="--full"
        if [[ "${{ inputs.validate }}" != "true" ]]; then
          ork validate -f "${{ inputs.validate }}" $FULL
        else
          ork validate $FULL
        fi

    - name: Simulate
      id: simulate
      if: inputs.simulate != '' || inputs.simulate-katalog != '' || inputs.simulate-depth == 'full'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SKIP_EXT="" CYCLES="" CRD="" DEBUG="" SKIP=""
        [[ "${{ inputs.simulate-skip-external }}" == "true" ]] && SKIP_EXT="--skip-external"
        [[ -n "${{ inputs.simulate-cycles }}"               ]] && CYCLES="--cycles ${{ inputs.simulate-cycles }}"
        [[ -n "${{ inputs.simulate-crd }}"                  ]] && CRD="--crd ${{ inputs.simulate-crd }}"
        [[ "${{ inputs.simulate-debug }}" == "true"         ]] && DEBUG="--debug-ops"
        [[ -n "${{ inputs.simulate-skip }}"                 ]] && SKIP="--skip ${{ inputs.simulate-skip }}"

        run_simulate() {
          if [[ -n "$DEBUG" ]]; then
            ork simulate "$@" $SKIP_EXT $CYCLES $CRD $DEBUG | tee "${{ inputs.simulate-debug-output }}"
          else
            ork simulate "$@" $SKIP_EXT $CYCLES $CRD
          fi
        }

        if   [[ -n "${{ inputs.simulate-katalog }}" ]]; then
          CR="" ; [[ -n "${{ inputs.simulate-cr }}" ]] && CR="--cr ${{ inputs.simulate-cr }}"
          run_simulate -f "${{ inputs.simulate-katalog }}" $CR
        elif [[ "${{ inputs.simulate-depth }}" == "full" ]]; then
          run_simulate ./... $SKIP
        elif [[ "${{ inputs.simulate }}" != "true" ]]; then
          run_simulate -f "${{ inputs.simulate }}"
        else
          run_simulate
        fi
        if [[ -n "$DEBUG" ]]; then
          echo "debug-file=${{ inputs.working-directory }}/${{ inputs.simulate-debug-output }}" >> $GITHUB_OUTPUT
        fi

    - name: Plan
      id: plan
      if: inputs.plan != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ -n "${{ inputs.plan-bundle }}" ]]; then
          ork plan -f "${{ inputs.plan }}" --bundle "${{ inputs.plan-bundle }}" | tee "${{ inputs.plan-output }}"
        elif [[ -n "${{ inputs.plan-cm }}" ]]; then
          ork plan -f "${{ inputs.plan }}" --cm "${{ inputs.plan-cm }}" | tee "${{ inputs.plan-output }}"
        else
          echo "Error: plan requires either plan-bundle or plan-cm" >&2
          exit 1
        fi
        echo "file=${{ inputs.working-directory }}/${{ inputs.plan-output }}" >> $GITHUB_OUTPUT
        if [[ ! -s "${{ inputs.plan-output }}" ]]; then
          echo "no-changes=true" >> $GITHUB_OUTPUT
        else
          echo "no-changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Template
      id: template
      if: inputs.template != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ "${{ inputs.template }}" != "true" ]]; then
          ork template -f "${{ inputs.template }}" --yaml -o "${{ inputs.template-yaml-output }}"
          ork template -f "${{ inputs.template }}" --json -o "${{ inputs.template-json-output }}"
        else
          ork template --yaml -o "${{ inputs.template-yaml-output }}"
          ork template --json -o "${{ inputs.template-json-output }}"
        fi
        echo "yaml-file=${{ inputs.working-directory }}/${{ inputs.template-yaml-output }}" >> $GITHUB_OUTPUT
        echo "json-file=${{ inputs.working-directory }}/${{ inputs.template-json-output }}" >> $GITHUB_OUTPUT

    - name: Generate bundle
      id: generate-bundle
      if: inputs.generate-bundle != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ork generate bundle \
          -f "${{ inputs.generate-bundle }}" \
          -o "${{ inputs.generate-bundle-output }}" \
          -n "${{ inputs.generate-bundle-namespace }}"
        echo "file=${{ inputs.working-directory }}/${{ inputs.generate-bundle-output }}" >> $GITHUB_OUTPUT

    - name: Generate configmap
      id: generate-configmap
      if: inputs.generate-configmap != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ork generate configmap \
          -f "${{ inputs.generate-configmap }}" \
          -o "${{ inputs.generate-configmap-output }}" \
          -n "${{ inputs.generate-configmap-namespace }}"
        echo "file=${{ inputs.working-directory }}/${{ inputs.generate-configmap-output }}" >> $GITHUB_OUTPUT

    - name: Generate RBAC
      id: generate-rbac
      if: inputs.generate-rbac != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ork generate rbac \
          -f "${{ inputs.generate-rbac }}" \
          -o "${{ inputs.generate-rbac-output }}" \
          -n "${{ inputs.generate-rbac-namespace }}"
        echo "file=${{ inputs.working-directory }}/${{ inputs.generate-rbac-output }}" >> $GITHUB_OUTPUT

    - name: Generate registry
      id: generate-registry
      if: inputs.generate-registry != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ork generate registry -d "${{ inputs.generate-registry }}"
        FIRST_DIR=$(echo "${{ inputs.generate-registry }}" | cut -d',' -f1 | xargs)
        echo "file=${{ inputs.working-directory }}/${FIRST_DIR}/pkg/runtime/zz_generated_runtime_registry.go" >> $GITHUB_OUTPUT

    - name: E2E
      if: inputs.e2e != '' || inputs.e2e-depth == 'full'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        KEEP="" CLUSTER="" SKIP="" WAIT=""
        [[ "${{ inputs.e2e-keep-cluster }}" == "true" ]] && KEEP="--keep-cluster"
        [[ -n "${{ inputs.e2e-cluster }}"             ]] && CLUSTER="--cluster ${{ inputs.e2e-cluster }}"
        [[ -n "${{ inputs.e2e-skip }}"                ]] && SKIP="--skip ${{ inputs.e2e-skip }}"
        [[ -n "${{ inputs.e2e-wait }}"                ]] && WAIT="--wait ${{ inputs.e2e-wait }}"

        REPORT_TMP=$(mktemp --suffix=.md)

        if   [[ "${{ inputs.e2e-depth }}" == "full" ]]; then
          ork e2e ./... $KEEP $CLUSTER $SKIP $WAIT --report-file "$REPORT_TMP"
        elif [[ "${{ inputs.e2e }}" != "true" ]]; then
          ork e2e -f "${{ inputs.e2e }}" $KEEP $CLUSTER --report-file "$REPORT_TMP"
        else
          ork e2e $KEEP $CLUSTER --report-file "$REPORT_TMP"
        fi

        cat "$REPORT_TMP" >> "$GITHUB_STEP_SUMMARY"
        [[ -n "${{ inputs.e2e-report-file }}" ]] && cp "$REPORT_TMP" "${{ inputs.e2e-report-file }}"
        rm -f "$REPORT_TMP"

    - name: Comment plan on PR
      if: inputs.comment-on-pr == 'true' && inputs.plan != '' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        PLAN_FILE: ${{ inputs.working-directory }}/${{ inputs.plan-output }}
        NO_CHANGES: ${{ steps.plan.outputs.no-changes }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const noChanges = process.env.NO_CHANGES === 'true';
          const planFile = process.env.PLAN_FILE;

          if (noChanges) {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Ork Plan — No Changes\n\nThe deployed operator configuration is already up to date.`
            });
            return;
          }

          if (!fs.existsSync(planFile)) {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Ork Plan Error\n\nPlan file not found at: \`${planFile}\`. Check workflow logs.`
            });
            return;
          }

          const raw = fs.readFileSync(planFile, "utf8");
          const stripAnsi = s => s.replace(/[][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><~]/g, "");
          const planOutput = stripAnsi(raw);
          const maxLength = 60000;
          const body = planOutput.length > maxLength
            ? planOutput.substring(0, maxLength) + "\n\n... (output truncated)"
            : planOutput;

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📋 Ork Plan\n\n\`\`\`\n${body}\n\`\`\``
          });

    - name: Registry push
      if: inputs.registry-push != ''
      id: push
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ORK_REGISTRY: ${{ inputs.registry-url }}
      run: |
        FORCE=""
        NO_E2E=""
        [[ "${{ inputs.registry-push-force }}" == "true" ]] && FORCE="--force"
        [[ "${{ inputs.registry-push-no-e2e }}" == "true" ]] && NO_E2E="--no-e2e"

        # Capture output to a temp file while still showing it in real-time
        PUSH_OUT=$(mktemp)

        set +e
        ork push ${{ inputs.registry-push }} $FORCE $NO_E2E 2>&1 | tee "$PUSH_OUT"
        PUSH_EXIT_CODE=${PIPESTATUS[0]}
        set -e

        # Extract the pattern:tag from "Pushing webapp-operator:v1.0.0 ..."
        PUSHED_PATTERN=$(grep -oP 'Pushing \K[^\s]+' "$PUSH_OUT" | head -1 || echo "")
        echo "pushed-pattern=$PUSHED_PATTERN" >> $GITHUB_OUTPUT

        rm -f "$PUSH_OUT"

        if [[ $PUSH_EXIT_CODE -ne 0 ]]; then
          exit $PUSH_EXIT_CODE
        fi

    - name: Inspect pushed Pattern
      if: success() && steps.push.outputs.pushed-pattern != ''
      shell: bash
      env:
        ORK_REGISTRY: ${{ inputs.registry-url }}
      run: |
        echo "## 📦 Pushed Pattern: ${{ steps.push.outputs.pushed-pattern }}" >> $GITHUB_STEP_SUMMARY

        INSPECT_OUT=$(ork inspect "${{ steps.push.outputs.pushed-pattern }}" | sed -E 's/\x1b\[[0-9;]*m//g')

        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY

        echo "$INSPECT_OUT" | grep -E "^(  Registry:|  Kind:|  Digest:|  Simulate:|  E2E:|  Typed:|  Runtime:)" | while read line; do
          key=$(echo "$line" | cut -d':' -f1 | sed 's/^  //')
          value=$(echo "$line" | cut -d':' -f2- | sed 's/^ //')
          # Replace status indicators
          value=$(echo "$value" | sed 's/✓ Verified/✅ Verified/g')
          value=$(echo "$value" | sed 's/✗ Failed/❌ Failed/g')
          value=$(echo "$value" | sed 's/⊘ Skipped/⏭️ Skipped/g')
          # Typed has special formatting - clean up the "requires custom runtime image" text
          value=$(echo "$value" | sed 's/· requires custom runtime image//g')
          echo "| $key | $value |" >> $GITHUB_STEP_SUMMARY
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Import" >> $GITHUB_STEP_SUMMARY
        echo '```yaml' >> $GITHUB_STEP_SUMMARY
        echo "$INSPECT_OUT" | sed -n '/To import:/,$p' | tail -n +2 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Registry pull
      id: registry-pull
      if: inputs.registry-pull != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ORK_REGISTRY: ${{ inputs.registry-url }}
      run: |
        OUT=""
        [[ -n "${{ inputs.registry-pull-out }}" ]] && OUT="--out ${{ inputs.registry-pull-out }}"
        ork pull ${{ inputs.registry-pull }} $OUT
        echo "path=${{ inputs.working-directory }}/${{ inputs.registry-pull-out || '.' }}" >> $GITHUB_OUTPUT

    - name: Gate
      if: inputs.gate != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CRD="" KATALOG=""
        [[ -n "${{ inputs.gate-crd }}"     ]] && CRD="--crd ${{ inputs.gate-crd }}"
        [[ -n "${{ inputs.gate-katalog }}" ]] && KATALOG="-f ${{ inputs.gate-katalog }}"

        if [[ "${{ inputs.gate }}" != "true" ]]; then
          ork gate $KATALOG "${{ inputs.gate }}" $CRD
        else
          ork gate $KATALOG $CRD
        fi

    - name: Serve play
      id: serve-play
      if: inputs.serve-play != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        KATALOG="" OUTPUT="serve-play.txt"
        [[ -n "${{ inputs.serve-play-katalog }}" ]] && KATALOG="-f ${{ inputs.serve-play-katalog }}"
        ork serve play $KATALOG "${{ inputs.serve-play }}" | tee "$OUTPUT"
        echo "file=${{ inputs.working-directory }}/$OUTPUT" >> $GITHUB_OUTPUT

    - name: Serve apply
      id: serve-apply
      if: inputs.serve-apply != '' && inputs.serve-url != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Resolve bearer token — OIDC takes precedence over a static token.
        BEARER=""
        if [[ "${{ inputs.serve-oidc }}" == "true" ]]; then
          if [[ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]]; then
            echo "::error::serve-oidc: true requires id-token: write permission on the job" >&2
            exit 1
          fi
          AUDIENCE="${{ inputs.serve-oidc-audience }}"
          BEARER=$(curl -sSfL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | jq -r '.value')
        elif [[ -n "${{ inputs.serve-token }}" ]]; then
          BEARER="${{ inputs.serve-token }}"
        else
          echo "::error::serve-apply requires either serve-oidc: true or serve-token" >&2
          exit 1
        fi

        TARGET="" ALIAS="" DRY_RUN=""
        [[ -n "${{ inputs.serve-target }}"  ]] && TARGET="--target ${{ inputs.serve-target }}"
        [[ -n "${{ inputs.serve-alias }}"   ]] && ALIAS="--alias ${{ inputs.serve-alias }}"
        [[ "${{ inputs.serve-dry-run }}" == "true" ]] && DRY_RUN="--dry-run"

        CR="${{ inputs.serve-apply }}"
        [[ "$CR" == "true" ]] && CR="cr.yaml"

        ork serve apply \
          --url "${{ inputs.serve-url }}" \
          --token "$BEARER" \
          $TARGET $ALIAS $DRY_RUN \
          "$CR"

        echo "applied=true" >> $GITHUB_OUTPUT
