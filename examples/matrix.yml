name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/beginner/01-hello-website
          - examples/beginner/02-with-service
          - examples/advanced/09-hooks

    defaults:
      run:
        working-directory: ${{ matrix.example }}

    steps:
      - uses: actions/checkout@v4

      - uses: orkspace/ork-action@v1
        with:
          e2e-file: e2e.yaml
