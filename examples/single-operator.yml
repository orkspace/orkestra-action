name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # validate → simulate → e2e: each layer is cheaper than the next.
      # simulate reads simulate.yaml and fails on assertion errors (no cluster needed).
      # e2e runs the full cluster lifecycle.
      - name: Validate, simulate, and e2e
        uses: orkspace/orkestra-action@v1
        with:
          validate: "true"
          simulate: "true"
          e2e: "true"

      - name: Generate bundle
        uses: orkspace/orkestra-action@v1
        id: bundle
        with:
          generate-bundle: ./katalog.yaml

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: ${{ steps.bundle.outputs.bundle-file }}
