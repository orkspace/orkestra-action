name: Typed operator CI

# For typed (Go hooks / constructor) operators.
# The ork CLI cannot run these — you must build your own operator binary,
# package it as a Docker image, and deploy Orkestra with that image.
#
# Flow:
#   1. Validate + simulate (no cluster — catches logic errors early)
#   2. Generate runtime registry (Go code) from katalog.yaml
#   3. Build the operator binary (Go)
#   4. Build and push the Docker image
#   5. Create cluster with ork (installs kind, kubectl, helm if absent)
#   6. Load image into kind
#   7. Generate bundle from katalog.yaml
#   8. Apply bundle (CRDs, RBAC, runtime config) — must be before helm
#   9. Deploy Orkestra with your operator image via Helm
#  10. Run e2e against the running operator

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/my-operator
  TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ── Step 1: validate and simulate ────────────────────────────────────────
      - name: Validate and simulate
        uses: orkspace/orkestra-action@v1
        with:
          validate: "true"
          simulate: "true"

      # ── Step 2: generate the runtime registry ────────────────────────────────
      # Writes pkg/runtime/zz_generated_runtime_registry.go from katalog.yaml.
      - name: Generate runtime registry
        uses: orkspace/orkestra-action@v1
        with:
          generate-registry: "."

      # ── Step 3: build the operator binary ────────────────────────────────────
      # -tags runtime registers your Go types and hooks with the Orkestra runtime.
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags runtime -o ./bin/operator ./cmd/operator

      # ── Step 4: build and push Docker image ──────────────────────────────────
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      # ── Step 5: create cluster ────────────────────────────────────────────────
      # ork create cluster downloads kind, kubectl, and helm if absent,
      # creates the ork-playground cluster, and switches kubectl context.
      - name: Create cluster
        if: github.event_name == 'pull_request'
        run: ork create cluster --name ork-playground

      # ── Step 6: load image into kind ─────────────────────────────────────────
      - name: Load image into kind
        if: github.event_name == 'pull_request'
        run: kind load docker-image ${{ env.IMAGE }}:${{ env.TAG }} --name ork-playground

      # ── Step 7: generate bundle ───────────────────────────────────────────────
      # The bundle contains the CRDs, RBAC, and runtime config for your operator.
      # It must be applied before Helm so the cluster has the right resources.
      - name: Generate bundle
        if: github.event_name == 'pull_request'
        id: bundle
        uses: orkspace/orkestra-action@v1
        with:
          generate-bundle: ./katalog.yaml
          generate-bundle-output: bundle.yaml

      # ── Step 8: apply bundle ──────────────────────────────────────────────────
      - name: Apply bundle
        if: github.event_name == 'pull_request'
        run: kubectl apply -f bundle.yaml

      # ── Step 9: deploy Orkestra with your operator image ─────────────────────
      - name: Deploy Orkestra
        if: github.event_name == 'pull_request'
        run: |
          helm repo add orkestra https://orkspace.github.io/orkestra
          helm upgrade --install orkestra orkestra/orkestra \
            --set runtime.image.repository=${{ env.IMAGE }} \
            --set runtime.image.tag=${{ env.TAG }} \
            --namespace orkestra-system \
            --create-namespace \
            --wait --timeout 120s

      # ── Step 10: run e2e against the running operator ─────────────────────────
      - name: E2E
        if: github.event_name == 'pull_request'
        uses: orkspace/orkestra-action@v1
        with:
          e2e: "true"
          e2e-cluster: kind-ork-playground

      - name: Upload bundle artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: ${{ steps.bundle.outputs.bundle-file }}
