name: Publish database-operator

# Same as typed-operator.yml but split into two jobs with binary and Docker layer caching.
# Uses the database-operator example from examples/registry-guide/12-ork-action/.
#
# publish-image  — generates registry, builds runtime binary (cached), pushes Docker image
# publish-pattern — generates registry, builds custom ork (cached), validates, simulates, pushes katalog
#
# publish-pattern needs publish-image so the image is always in the registry before
# the katalog is pushed — consumers always pull both atomically.

on:
  workflow_dispatch:


jobs:
  publish-image:
    name: Build and push runtime image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./database-operator/go.mod
          cache: true
          cache-dependency-path: ./database-operator/go.sum

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Cache the runtime binary by source hash. On hit, the binary is ready
      #    for the Docker context — generate and build are skipped entirely.
      - name: Cache runtime binary
        id: cache-runtime
        uses: actions/cache@v5
        with:
          path: database-operator/ork
          key: runtime-binary-${{ hashFiles('database-operator/go.sum', 'database-operator/**/*.go', 'database-operator/katalog.yaml') }}

      # 2. Generate pkg/typeregistry/zz_generated_typeregistry.go from katalog.yaml.
      #    Uses the standard ork installed by the action — only needs ork generate registry.
      #    Skipped on cache hit.
      - name: Generate runtime registry
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        uses: orkspace/orkestra-action@v1
        with:
          generate-registry: "."
          working-directory: ./database-operator

      # 3. Build the production runtime binary (tags: runtime — no validate/simulate/e2e commands).
      #    Placed in the Docker build context so the Dockerfile can COPY it in.
      #    Skipped on cache hit.
      - name: Build runtime binary
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        working-directory: database-operator
        run: |
          make build-runtime
          cp $HOME/.orkestra/bin/runtime/ork ./ork

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORK_ACTION_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and push the runtime image. Docker layer cache is stored in GHA cache
      #    so repeated pushes only rebuild changed layers.
      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: ./database-operator
          push: true
          tags: ghcr.io/${{ env.OWNER }}/database-operator:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove binary from Docker context
        working-directory: database-operator
        run: rm -f ./ork

  publish-pattern:
    name: Validate and publish katalog
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./database-operator/go.mod
          cache: true
          cache-dependency-path: ./database-operator/go.sum

      # Ensure ~/.orkestra/bin is in PATH so the cached binary is visible to the
      # publish action below without it needing to reinstall.
      - name: Add ork to PATH
        run: echo "$HOME/.orkestra/bin" >> $GITHUB_PATH

      # 1. Cache the full CLI binary (with type registry compiled in) by source hash.
      #    On hit, the custom ork is already in PATH — generate and build are skipped entirely.
      - name: Cache full CLI binary
        id: cache-cli
        uses: actions/cache@v5
        with:
          path: ~/.orkestra/bin/ork
          key: cli-binary-${{ hashFiles('database-operator/go.sum', 'database-operator/**/*.go', 'database-operator/katalog.yaml') }}

      # 2. Generate pkg/typeregistry/zz_generated_typeregistry.go from katalog.yaml.
      #    Uses the standard ork installed by the action — only needs ork generate registry.
      #    Skipped on cache hit.
      - name: Generate runtime registry
        if: steps.cache-cli.outputs.cache-hit != 'true'
        uses: orkspace/orkestra-action@v1
        with:
          generate-registry: "."
          working-directory: ./database-operator

      # 3. Build the custom ork binary with the type registry compiled in.
      #    Writes to ~/.orkestra/bin/ork, replacing the standard binary the action
      #    installed in step 2. Subsequent action steps pick it up automatically.
      #    Skipped on cache hit.
      - name: Build custom ork (full CLI)
        if: steps.cache-cli.outputs.cache-hit != 'true'
        working-directory: database-operator
        run: make build

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 4. Validate, simulate, and push using the custom ork (type registry compiled in).
      #    Image is already in the registry — katalog published last so consumers
      #    always pull both atomically.
      - name: Publish to registry
        uses: orkspace/orkestra-action@v1
        with:
          template: "true"
          validate: "true"
          simulate: "true"
          registry-push: "database-operator:${{ github.ref_name }} ."
          registry-url: "ghcr.io/${{ env.OWNER }}/katalogs"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.ORK_ACTION_TOKEN }}
          working-directory: ./database-operator
